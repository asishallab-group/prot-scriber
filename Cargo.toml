[package]
name = "prot-scriber"
version = "1.0.0"
authors = ["Dr. Asis Hallab <asis.hallab@gmail.com>"]
edition = "2018"
description = "Assigns short human readable descriptions (HRD) to query biological sequences, or to gene families of them, using the reference descriptions of sequence similarity search results."
# GPL-3.0-only, not -or-later: LICENSE is the bare GPLv3 text and no source file carries the
# "or (at your option) any later version" grant, so the only version conveyed is 3.
license = "GPL-3.0-only"
repository = "https://github.com/usadellab/prot-scriber"
homepage = "https://github.com/usadellab/prot-scriber"
readme = "README.md"
keywords = ["bioinformatics", "proteins", "annotation", "blast", "sequence"]
categories = ["command-line-utilities", "science"]
# The benchmark tree is the evaluation pipelines, which are Python and shell and belong to the
# research, not to the tool. Without this the package carries 138 stray .pyc files and nothing else
# from it -- the scripts themselves live on the evaluation branches.
exclude = ["benchmark/", ".claude/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive", "wrap_help"] }
# Already in the tree as clap's own colour machinery. Taken directly so that prot-scriber's
# errors are styled by the same rules clap styles its errors by -- terminal detection,
# NO_COLOR, CLICOLOR_FORCE -- rather than by a second implementation that could drift.
anstream = "1"
anstyle = "1"
regex = "1.5.4"
rayon = "1.5.1"
lazy_static = "1.4.0"
num_cpus = "1.13.1"
fancy-regex = "0.10.0"
toml = "1.1.4"
blake3 = "1.8.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Only to restore the default disposition of SIGPIPE, so that `prot-scriber ... -o - | head`
# ends the way every other unix tool ends it. `libc` is already in the dependency graph via
# `num_cpus`, so this is a direct edge to a crate that was being compiled anyway, not a crate more.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Only to lower RLIMIT_NPROC in a child process, so the test for a refused thread count is
# deterministic rather than dependent on the shell supporting `ulimit -u`. Already a normal
# dependency, so this adds no crate.
libc = "0.2"

# Float comparison with absolute, relative and ULP tolerances. `assert_approx_eq` only ever
# offered an absolute epsilon and has not been released since 2018.
approx = "0.5.1"
# Drop-in `assert_eq!` / `assert_ne!` that report a diff instead of two Debug dumps; what makes
# the end-to-end tests comparing whole output tables readable when they fail.
pretty_assertions = "1.4.1"
